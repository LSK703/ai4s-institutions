<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compare · AI4S Institutions</title>
    <style>
      #compare-live .figure-well {
        max-height: none !important;
        height: auto !important;
        overflow: visible !important;
      }
      #compare-frame {
        display: block;
        width: 100%;
        height: 1200px !important;
        min-height: 1200px !important;
        max-height: none !important;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body data-page="compare">
    <div id="site-header"></div>
    <main class="wrap">
      <p class="kicker" data-i18n="kickerExplore"></p>
      <h1 data-i18n="compareTitle"></h1>
      <p class="lede" data-i18n="compareLede"></p>
      <p class="note" data-i18n="compareNote"></p>
      <div class="tabs" id="tabs">
        <button class="tab active" type="button" data-tab="a" data-i18n="tabA"></button>
        <button class="tab" type="button" data-tab="b" data-i18n="tabB"></button>
        <button class="tab" type="button" data-tab="c" data-i18n="tabC"></button>
        <button class="tab" type="button" data-tab="d" data-i18n="tabD"></button>
      </div>
      <div id="compare-live">
        <p class="meta-line" id="compare-tab-note"></p>
        <div class="figure-well compare-well" style="max-height:none;overflow:visible;height:auto">
          <iframe class="figure-frame compare" id="compare-frame" data-i18n-title="compareTitle" style="height:1200px;min-height:1200px;max-height:none;overflow:visible"></iframe>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script type="module" src="../src/pages/compare.js?v=d1"></script>
  </body>
</html>
