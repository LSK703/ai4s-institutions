<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>China–UK discipline mix</title>
    <script src="plotly.min.js"></script>
    <style>
      :root { --ink:#1a2330; --muted:#5c6b7a; --bg:#fff; --line:#cfd6de; --band:#e8eaed; }
      html, body { margin:0; background:var(--bg); color:var(--ink); font-family:"Source Sans 3","Noto Sans SC","Segoe UI",sans-serif; }
      header { padding:12px 16px 4px; }
      h1 { margin:0 0 6px; font-size:1.15rem; }
      .meta { margin:0; color:var(--muted); font-size:0.86rem; line-height:1.45; }
      .panel { margin:10px 8px 18px; border:1px solid var(--line); }
      .panel-head {
        background:var(--band); text-align:center; font-size:1.05rem; font-weight:600;
        padding:8px 12px; border-bottom:1px solid var(--line); letter-spacing:0.04em;
      }
      #plot-sys { width:100%; height:280px; }
      #plot-cn, #plot-gb { width:100%; height:520px; }
      html.embed header { display:none; }
      html.embed, html.embed body { background:transparent; }
      html.embed .panel { margin:8px 0 14px; }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
    </header>
    <div id="plot-sys"></div>
    <div class="panel">
      <div class="panel-head" id="head-cn"></div>
      <div id="plot-cn"></div>
    </div>
    <div class="panel">
      <div class="panel-head" id="head-gb"></div>
      <div id="plot-gb"></div>
    </div>

      const q = new URLSearchParams(location.search);
      const lang = q.get("lang") === "en" ? "en" : "zh";
      if (q.get("embed") === "1") document.documentElement.classList.add("embed");
      const L = {
        zh: {
          title: "中英高校 AI4S 学科构成",
          meta: (d) => `高等教育机构 · n_ai4s ≥ 200 · 2015–2024。去掉信息与计算后重新归一。中国 ${d.n_cn} 所、英国 ${d.n_gb} 所。`,
          x: "AI4S论文份额",
          world: "全球", cnSys: "中国高校", gbSys: "英国高校",
          cn: "中国", gb: "英国", hover: "份额"
        },
        en: {
          title: "China–UK AI4S discipline mix",
          meta: (d) => `Higher-education institutions · n_ai4s ≥ 200 · 2015–2024. Information & computing dropped, then renormalized. China ${d.n_cn} universities, UK ${d.n_gb}.`,
          x: "Share of AI4S papers",
          world: "World", cnSys: "Chinese universities", gbSys: "UK universities",
          cn: "China", gb: "United Kingdom", hover: "Share"
        }
      }[lang];
      document.title = L.title;
      document.getElementById("title").textContent = L.title;
      document.getElementById("meta").textContent = L.meta(DATA);
      document.getElementById("head-cn").textContent = L.cn;
      document.getElementById("head-gb").textContent = L.gb;

      const stack = DATA.stack;
      const lab = (item) => lang === "zh" ? item.zh : item.en;

      function traces(rows, sharesOf, thresh) {
        return stack.map((s) => {
          const x = rows.map((row) => sharesOf(row)[s.key] || 0);
          const text = x.map((v) => v >= thresh ? Math.round(v * 100) + "%" : "");
          return {
            type: "bar",
            name: lab(s),
            orientation: "h",
            y: rows.map(lab),
            x,
            marker: { color: s.color, line: { width: 0 } },
            text,
            textposition: "inside",
            insidetextanchor: "middle",
            constraintext: "none",
            textfont: { color: s.text, size: 12, family: "Source Sans 3, Noto Sans SC, Segoe UI, sans-serif" },
            hovertemplate: "%{y}<br>" + lab(s) + ": %{x:.1%}<extra></extra>"
          };
        });
      }

      const layoutBase = {
        barmode: "stack",
        bargap: 0.28,
        margin: { l: lang === "zh" ? 108 : 168, r: 18, t: 36, b: 48 },
        legend: {
          orientation: "h",
          y: 1.18,
          x: 0.5,
          xanchor: "center",
          font: { size: 12 },
          traceorder: "normal"
        },
        xaxis: {
          range: [0, 1],
          tickformat: ".0%",
          title: { text: L.x, standoff: 8 },
          gridcolor: "#e6edf3",
          zeroline: false,
          dtick: 0.2
        },
        yaxis: {
          autorange: "reversed",
          tickfont: { size: 13 },
          ticksuffix: "  "
        },
        paper_bgcolor: "rgba(0,0,0,0)",
        plot_bgcolor: "rgba(0,0,0,0)",
        font: { family: "Source Sans 3, Noto Sans SC, Segoe UI, sans-serif", color: "#1a2330", size: 13 }
      };

      const sysRows = [
        { zh: L.world, en: L.world, shares: DATA.systems.world },
        { zh: L.cnSys, en: L.cnSys, shares: DATA.systems.cn },
        { zh: L.gbSys, en: L.gbSys, shares: DATA.systems.gb }
      ];
      Plotly.newPlot("plot-sys", traces(sysRows, (r) => r.shares, 0.05), Object.assign({}, layoutBase, {
        bargap: 0.32,
        margin: Object.assign({}, layoutBase.margin, { l: lang === "zh" ? 88 : 156, t: 44 })
      }), { responsive: true, displaylogo: false });

      const uniLayout = Object.assign({}, layoutBase, {
        bargap: 0.22,
        showlegend: true,
        margin: Object.assign({}, layoutBase.margin, { t: 44, l: lang === "zh" ? 118 : 200 })
      });
      Plotly.newPlot("plot-cn", traces(DATA.unis.cn, (r) => r.shares, 0.155), uniLayout, { responsive: true, displaylogo: false });
      Plotly.newPlot("plot-gb", traces(DATA.unis.gb, (r) => r.shares, 0.155), uniLayout, { responsive: true, displaylogo: false });
    </script>
  </body>
</html>
