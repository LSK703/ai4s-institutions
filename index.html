<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The AI4S Macroscope</title>
    <link rel="stylesheet" href="src/styles.css?v=brand1" />
  </head>
  <body data-page="enter" class="enter-page">
    <canvas id="silk" class="enter-canvas" aria-hidden="true"></canvas>
    <div class="enter-vignette" aria-hidden="true"></div>
    <header class="enter-bar">
      <span class="enter-mark">AI4S</span>
      <div class="enter-tools">
        <button class="enter-theme theme-toggle" type="button" id="theme-toggle" aria-label="theme">
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4" fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M16.5 13.5A7 7 0 0 1 10 4.1 7 7 0 1 0 19.9 14a7 7 0 0 1-3.4-.5z" fill="none" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </button>
        <button class="enter-lang" type="button" id="lang-toggle" data-i18n="langBtn"></button>
      </div>
    </header>
    <main class="enter-copy">
      <p class="enter-kicker" data-i18n="enterKicker"></p>
      <h1 data-i18n="enterTitle"></h1>
      <p class="enter-sub" data-i18n="enterSub"></p>
      <a class="enter-cta" href="home.html" data-i18n="enterCta"></a>
    </main>
    <script type="module" src="src/pages/enter.js?v=earth1"></script>
  </body>
</html>
