<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4S Institutions Open Edition</title>
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css" />
  </head>
  <body data-page="home">
    <div id="site-header"></div>
    <main class="wrap">
      <style>
        .ed-home { padding: 2.6rem 0 0; }
        .ed-home + .stats { margin-top: 2.4rem; }
        .ed-hero { padding: 0 0 3.1rem; border-bottom: 1px solid var(--line); }
        .ed-mark,
        .ed-num {
          margin: 0 0 1.15rem;
          font-size: 0.72rem;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--muted);
        }
        .ed-hero h1 {
          margin: 0 0 1.55rem;
          max-width: 22rem;
          font-size: clamp(2.05rem, 4.6vw, 3.2rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
        }
        .ed-meta {
          margin: 0;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .ed-sec { padding: 3rem 0; border-bottom: 1px solid var(--line); }
        .ed-sec h2 {
          margin: 0 0 0.85rem;
          max-width: 24rem;
          font-size: clamp(1.55rem, 3vw, 2.1rem);
          line-height: 1.18;
          letter-spacing: -0.025em;
        }
        .ed-sec p {
          margin: 0 0 0.55rem;
          max-width: 34rem;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.55;
        }
        .ed-sec .ed-caption {
          margin-top: 1.15rem;
          color: var(--ink);
          font-weight: 600;
        }
        .ed-link {
          display: inline-block;
          margin-top: 1.15rem;
          padding-bottom: 0.05rem;
          color: var(--ink);
          border-bottom: 1px solid currentColor;
          text-decoration: none;
        }
        .ed-link:hover { color: var(--accent); text-decoration: none; }
        .ed-live {
          margin: 1.7rem 0 0.35rem;
          width: 100%;
          aspect-ratio: 16 / 9;
          overflow: hidden;
        }
        #home-chart-live {
          container-type: inline-size;
          max-width: none;
          width: 100%;
          height: calc(min(52rem, 82cqi) * 520 / 1000);
          aspect-ratio: auto;
          margin-top: 1.15rem;
          padding-bottom: 1.35rem;
          overflow: visible;
          perspective: 900px;
        }
        #home-chart-live.swiper {
          margin-left: 0;
          margin-right: 0;
        }
        #home-chart-live .swiper-wrapper {
          align-items: stretch;
          transform-style: preserve-3d;
        }
        #home-chart-live .swiper-slide {
          width: min(52rem, 82%);
          height: 100%;
          background: #fff;
          box-shadow:
            0 22px 48px rgba(0, 0, 0, 0.32),
            0 6px 16px rgba(0, 0, 0, 0.18);
        }
        #home-chart-live .swiper-slide-active {
          box-shadow:
            0 28px 64px rgba(0, 0, 0, 0.4),
            0 10px 22px rgba(0, 0, 0, 0.22);
        }
        #home-chart-live .swiper-slide-shadow-left,
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to left,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-button-prev,
        #home-chart-live .swiper-button-next {
          color: var(--ink);
          width: 2rem;
          height: 2rem;
          margin-top: 0;
          top: 50%;
          transform: translateY(-50%);
        }
        #home-chart-live .swiper-button-prev::after,
        #home-chart-live .swiper-button-next::after {
          font-size: 1.15rem;
          font-weight: 700;
        }
        #home-chart-live .swiper-button-prev { left: -0.2rem; }
        #home-chart-live .swiper-button-next { right: -0.2rem; }
        .ed-live iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: 0;
          background: transparent;
          opacity: 1;
          transition: opacity 0.4s ease;
        }
        .ed-live iframe.is-wait { opacity: 0; }
        #home-map-live {
          width: min(52rem, 82%);
          max-width: min(52rem, 82%);
          aspect-ratio: 1000 / 520;
          margin-top: 1.15rem;
          margin-left: auto;
          margin-right: auto;
        }
        #home-chart-dots {
          position: static;
          bottom: auto;
          left: auto;
          width: auto;
          transform: none;
          display: flex;
          justify-content: center;
          gap: 0.45rem;
          margin: 0.85rem 0 0.35rem;
        }
        #home-chart-dots .swiper-pagination-bullet {
          width: 0.45rem;
          height: 0.45rem;
          margin: 0 !important;
          border-radius: 50%;
          background: var(--muted);
          opacity: 0.4;
        }
        #home-chart-dots .swiper-pagination-bullet-active {
          background: var(--ink);
          opacity: 1;
        }
        .stats.stats-orbs {
          display: flex;
          flex-wrap: wrap;
          align-items: flex-end;
          justify-content: center;
          gap: 0.4rem 2.4rem;
          min-height: 17.5rem;
          margin: 0.2rem 0 2.4rem;
          padding: 1.1rem 0 2.2rem;
          overflow: visible;
        }
        .stats.stats-orbs .stat {
          --tilt-x: 0deg;
          --tilt-y: 0deg;
          --rest-x: 18deg;
          --rest-y: -8deg;
          --lx: 30%;
          --ly: 22%;
          --orb: 168, 214, 236;
          --orb-deep: 40, 92, 128;
          position: relative;
          flex: 0 0 auto;
          aspect-ratio: 1;
          padding: 0;
          border: 0;
          background: transparent;
          perspective: 340px;
          perspective-origin: 50% 38%;
          animation: orb-float 5.4s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(1) {
          width: min(12.8rem, 42vw);
          margin-bottom: 2.1rem;
          animation-duration: 5.1s;
          --rest-x: 16deg;
          --rest-y: -12deg;
          --orb: 186, 228, 248;
          --orb-deep: 36, 102, 148;
        }
        .stats.stats-orbs .stat:nth-child(2) {
          width: min(9.6rem, 34vw);
          margin-bottom: 0.15rem;
          animation-delay: 0.85s;
          animation-duration: 6.2s;
          --rest-x: 22deg;
          --rest-y: 10deg;
          --orb: 156, 214, 210;
          --orb-deep: 28, 96, 108;
        }
        .stats.stats-orbs .stat:nth-child(3) {
          width: min(13.6rem, 44vw);
          margin-bottom: 2.8rem;
          animation-delay: 0.35s;
          animation-duration: 5.8s;
          --rest-x: 14deg;
          --rest-y: -4deg;
          --orb: 210, 236, 255;
          --orb-deep: 48, 88, 150;
        }
        .stats.stats-orbs .stat:nth-child(4) {
          width: min(10.4rem, 36vw);
          margin-bottom: 0.85rem;
          animation-delay: 1.4s;
          animation-duration: 4.7s;
          --rest-x: 20deg;
          --rest-y: 12deg;
          --orb: 148, 196, 232;
          --orb-deep: 24, 78, 132;
        }
        .stats.stats-orbs .stat-core {
          position: relative;
          z-index: 1;
          width: 100%;
          height: 100%;
          transform-style: preserve-3d;
          transform: rotateX(calc(var(--rest-x) + var(--tilt-x))) rotateY(calc(var(--rest-y) + var(--tilt-y)));
          transition: transform 0.28s ease;
        }
        .stats.stats-orbs .stat-blob {
          position: absolute;
          inset: 0;
          transform-style: preserve-3d;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          animation: blob-morph 8s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(2) .stat-blob {
          animation-duration: 9.4s;
          animation-delay: -2.1s;
        }
        .stats.stats-orbs .stat:nth-child(3) .stat-blob {
          animation-duration: 7.6s;
          animation-delay: -4.4s;
        }
        .stats.stats-orbs .stat:nth-child(4) .stat-blob {
          animation-duration: 10.2s;
          animation-delay: -1.3s;
        }
        .stats.stats-orbs .stat-back,
        .stats.stats-orbs .stat-equator,
        .stats.stats-orbs .stat-glass {
          position: absolute;
          border-radius: inherit;
          pointer-events: none;
        }
        .stats.stats-orbs .stat-back {
          inset: 0;
          transform: translateZ(-42px) scale(0.92);
          background:
            radial-gradient(circle at 48% 58%, rgba(var(--orb), 0.16), transparent 46%),
            radial-gradient(circle at 70% 78%, rgba(var(--orb-deep), 0.34), transparent 52%),
            radial-gradient(circle at 50% 50%, rgba(var(--orb), 0.08), rgba(8, 16, 28, 0.28) 72%);
          box-shadow:
            inset 0 0 28px rgba(var(--orb-deep), 0.28),
            0 0 0 1px rgba(255, 255, 255, 0.06);
        }
        .stats.stats-orbs .stat-equator {
          inset: 9%;
          border: 1px solid rgba(255, 255, 255, 0.22);
          transform: translateZ(-2px);
          box-shadow:
            0 0 10px rgba(255, 255, 255, 0.08),
            inset 0 0 8px rgba(var(--orb), 0.12);
          opacity: 0.7;
        }
        .stats.stats-orbs .stat-inner {
          position: absolute;
          inset: 0;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 1.35rem 1rem;
          transform: translateZ(0) scale(0.86);
          color: var(--ink);
        }
        .stats.stats-orbs .stat-glass {
          inset: 0;
          z-index: 3;
          transform: translateZ(38px);
          background:
            radial-gradient(circle at var(--lx) var(--ly), rgba(255, 255, 255, 0.34) 0 7%, transparent 20%),
            radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.04), transparent 46%),
            radial-gradient(circle at 50% 50%, transparent 58%, rgba(255, 255, 255, 0.16) 78%, rgba(var(--orb-deep), 0.18) 100%);
          border: 1px solid rgba(255, 255, 255, 0.28);
          box-shadow:
            inset 10px 12px 16px rgba(255, 255, 255, 0.1),
            inset -14px -18px 22px rgba(var(--orb-deep), 0.18),
            0 18px 32px rgba(8, 20, 36, 0.18),
            0 0 16px rgba(var(--orb), 0.12);
        }
        .stats.stats-orbs .stat-glass::before {
          content: "";
          position: absolute;
          top: 12%;
          left: 18%;
          width: 36%;
          height: 20%;
          border-radius: 50%;
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.42), rgba(255, 255, 255, 0.04));
          transform: rotate(-28deg);
          filter: blur(0.35px);
        }
        .stats.stats-orbs .stat-glass::after {
          content: "";
          position: absolute;
          right: 20%;
          bottom: 18%;
          width: 16%;
          height: 9%;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.12);
          filter: blur(1.4px);
        }
        .stats.stats-orbs .stat::before {
          content: "";
          position: absolute;
          left: 16%;
          right: 16%;
          bottom: -18%;
          height: 22%;
          border-radius: 50%;
          background: radial-gradient(ellipse, rgba(8, 20, 36, 0.32), transparent 72%);
          filter: blur(7px);
          z-index: 0;
          pointer-events: none;
        }
        .stats.stats-orbs .stat::after {
          content: "";
          position: absolute;
          inset: -18%;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          background: radial-gradient(circle, rgba(var(--orb), 0.24), transparent 66%);
          filter: blur(12px);
          z-index: 0;
          animation: orb-glow 3.8s ease-in-out infinite, blob-morph 8s ease-in-out infinite;
          pointer-events: none;
        }
        .stats.stats-orbs .stat:nth-child(2)::after {
          animation-duration: 3.8s, 9.4s;
          animation-delay: 0.6s, -2.1s;
        }
        .stats.stats-orbs .stat:nth-child(3)::after {
          animation-duration: 3.8s, 7.6s;
          animation-delay: 1.2s, -4.4s;
        }
        .stats.stats-orbs .stat:nth-child(4)::after {
          animation-duration: 3.8s, 10.2s;
          animation-delay: 1.9s, -1.3s;
        }
        .stats.stats-orbs .stat-inner b {
          font-size: clamp(1.05rem, 2.2vw, 1.5rem);
          color: var(--stat);
          text-shadow: 0 1px 10px rgba(8, 20, 36, 0.22);
          line-height: 1.12;
        }
        .stats.stats-orbs .stat-inner span {
          margin-top: 0.32rem;
          max-width: 8.6rem;
          font-size: 0.7rem;
          line-height: 1.3;
          color: var(--muted);
        }
        .stats.stats-orbs .stat:nth-child(2) .stat-inner b,
        .stats.stats-orbs .stat:nth-child(4) .stat-inner b {
          font-size: clamp(0.95rem, 1.9vw, 1.28rem);
        }
        .stats.stats-orbs .stat:hover .stat-glass,
        .stats.stats-orbs .stat:focus-within .stat-glass {
          box-shadow:
            inset 10px 12px 16px rgba(255, 255, 255, 0.12),
            inset -14px -18px 22px rgba(var(--orb-deep), 0.16),
            0 20px 36px rgba(8, 20, 36, 0.2),
            0 0 16px rgba(var(--orb), 0.18);
        }
        .stats.stats-orbs .stat:hover::after,
        .stats.stats-orbs .stat:focus-within::after {
          filter: blur(12px);
          opacity: 0.7;
        }
        [data-theme="light"] .stats.stats-orbs .stat-back {
          background:
            radial-gradient(circle at 48% 58%, rgba(var(--orb), 0.12), transparent 46%),
            radial-gradient(circle at 70% 78%, rgba(var(--orb-deep), 0.16), transparent 52%),
            radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.12), rgba(var(--orb), 0.1) 72%);
        }
        [data-theme="light"] .stats.stats-orbs .stat-glass {
          background:
            radial-gradient(circle at var(--lx) var(--ly), rgba(255, 255, 255, 0.46) 0 7%, transparent 20%),
            radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.08), transparent 46%),
            radial-gradient(circle at 50% 50%, transparent 58%, rgba(255, 255, 255, 0.28) 78%, rgba(var(--orb-deep), 0.1) 100%);
          border-color: rgba(255, 255, 255, 0.5);
          box-shadow:
            inset 10px 12px 16px rgba(255, 255, 255, 0.22),
            inset -12px -16px 20px rgba(var(--orb-deep), 0.08),
            0 14px 28px rgba(40, 80, 120, 0.1),
            0 0 12px rgba(var(--orb), 0.12);
        }
        [data-theme="light"] .stats.stats-orbs .stat::after {
          background: radial-gradient(circle, rgba(var(--orb), 0.18), transparent 66%);
        }
        [data-theme="light"] .stats.stats-orbs .stat::before {
          background: radial-gradient(ellipse, rgba(40, 80, 120, 0.18), transparent 72%);
        }
        @keyframes orb-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-0.85rem); }
        }
        @keyframes orb-glow {
          0%, 100% { opacity: 0.32; transform: scale(0.92); }
          50% { opacity: 0.62; transform: scale(1.06); }
        }
        @keyframes blob-morph {
          0% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            rotate: 0deg;
          }
          25% {
            border-radius: 30% 60% 70% 40% / 50% 60% 30% 70%;
            rotate: 8deg;
          }
          50% {
            border-radius: 50% 60% 30% 70% / 30% 40% 70% 60%;
            rotate: -6deg;
          }
          75% {
            border-radius: 40% 70% 60% 30% / 70% 30% 50% 60%;
            rotate: 5deg;
          }
          100% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            rotate: 0deg;
          }
        }
        @media (max-width: 980px) {
          .stats.stats-orbs {
            gap: 1.2rem 1.6rem;
            min-height: 0;
          }
          .stats.stats-orbs .stat:nth-child(1),
          .stats.stats-orbs .stat:nth-child(3) { margin-bottom: 0.4rem; }
        }
        @media (prefers-reduced-motion: reduce) {
          .stats.stats-orbs .stat,
          .stats.stats-orbs .stat::after,
          .stats.stats-orbs .stat-blob {
            animation: none;
          }
        }
      </style>
