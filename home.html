<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4S Institutions Open Edition</title>
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css" />
  </head>
  <body data-page="home">
    <div id="site-header"></div>
    <main class="wrap">
      <style>
        .ed-home { padding: 2.6rem 0 0; }
        .ed-home + .stats { margin-top: 2.4rem; }
        .ed-hero { padding: 0 0 3.1rem; border-bottom: 1px solid var(--line); }
        .ed-mark,
        .ed-num {
          margin: 0 0 1.15rem;
          font-size: 0.72rem;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--muted);
        }
        .ed-hero h1 {
          margin: 0 0 1.55rem;
          max-width: 22rem;
          font-size: clamp(2.05rem, 4.6vw, 3.2rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
        }
        .ed-meta {
          margin: 0;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .ed-sec { padding: 3rem 0; border-bottom: 1px solid var(--line); }
        .ed-sec h2 {
          margin: 0 0 0.85rem;
          max-width: 24rem;
          font-size: clamp(1.55rem, 3vw, 2.1rem);
          line-height: 1.18;
          letter-spacing: -0.025em;
        }
        .ed-sec p {
          margin: 0 0 0.55rem;
          max-width: 34rem;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.55;
        }
        .ed-sec .ed-caption {
          margin-top: 1.15rem;
          color: var(--ink);
          font-weight: 600;
        }
        .ed-link {
          display: inline-block;
          margin-top: 1.15rem;
          padding-bottom: 0.05rem;
          color: var(--ink);
          border-bottom: 1px solid currentColor;
          text-decoration: none;
        }
        .ed-link:hover { color: var(--accent); text-decoration: none; }
        .ed-live {
          margin: 1.7rem 0 0.35rem;
          width: 100%;
          aspect-ratio: 16 / 9;
          overflow: hidden;
        }
        #home-chart-live {
          container-type: inline-size;
          max-width: none;
          width: 100%;
          height: calc(min(52rem, 82cqi) * 520 / 1000);
          aspect-ratio: auto;
          margin-top: 1.15rem;
          padding-bottom: 1.35rem;
          overflow: visible;
          perspective: 900px;
        }
        #home-chart-live.swiper {
          margin-left: 0;
          margin-right: 0;
        }
        #home-chart-live .swiper-wrapper {
          align-items: stretch;
          transform-style: preserve-3d;
        }
        #home-chart-live .swiper-slide {
          width: min(52rem, 82%);
          height: 100%;
          background: #fff;
          box-shadow:
            0 22px 48px rgba(0, 0, 0, 0.32),
            0 6px 16px rgba(0, 0, 0, 0.18);
        }
        #home-chart-live .swiper-slide-active {
          box-shadow:
            0 28px 64px rgba(0, 0, 0, 0.4),
            0 10px 22px rgba(0, 0, 0, 0.22);
        }
        #home-chart-live .swiper-slide-shadow-left,
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to left,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-button-prev,
        #home-chart-live .swiper-button-next {
          color: var(--ink);
          width: 2rem;
          height: 2rem;
          margin-top: 0;
          top: 50%;
          transform: translateY(-50%);
        }
        #home-chart-live .swiper-button-prev::after,
        #home-chart-live .swiper-button-next::after {
          font-size: 1.15rem;
          font-weight: 700;
        }
        #home-chart-live .swiper-button-prev { left: -0.2rem; }
        #home-chart-live .swiper-button-next { right: -0.2rem; }
        .ed-live iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: 0;
          background: transparent;
          opacity: 1;
          transition: opacity 0.4s ease;
        }
        .ed-live iframe.is-wait { opacity: 0; }
        #home-map-live {
          width: min(52rem, 82%);
          max-width: min(52rem, 82%);
          aspect-ratio: 1000 / 520;
          margin-top: 1.15rem;
          margin-left: auto;
          margin-right: auto;
        }
        #home-chart-dots {
          position: static;
          bottom: auto;
          left: auto;
          width: auto;
          transform: none;
          display: flex;
          justify-content: center;
          gap: 0.45rem;
          margin: 0.85rem 0 0.35rem;
        }
        #home-chart-dots .swiper-pagination-bullet {
          width: 0.45rem;
          height: 0.45rem;
          margin: 0 !important;
          border-radius: 50%;
          background: var(--muted);
          opacity: 0.4;
        }
        #home-chart-dots .swiper-pagination-bullet-active {
          background: var(--ink);
          opacity: 1;
        }
        .stats.stats-orbs {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 1.2rem 1rem;
          margin: 0.4rem 0 2.2rem;
          padding: 1.4rem 0 1.8rem;
          justify-items: center;
          overflow: visible;
        }
        .stats.stats-orbs .stat {
          --tilt-x: 0deg;
          --tilt-y: 0deg;
          position: relative;
          width: min(11.6rem, 100%);
          aspect-ratio: 1;
          padding: 0;
          border: 0;
          background: transparent;
          perspective: 700px;
          animation: orb-float 4.8s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(1) { animation-delay: 0s; }
        .stats.stats-orbs .stat:nth-child(2) { animation-delay: 0.7s; }
        .stats.stats-orbs .stat:nth-child(3) { animation-delay: 1.3s; }
        .stats.stats-orbs .stat:nth-child(4) { animation-delay: 2s; }
        .stats.stats-orbs .stat-core {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          text-align: center;
          padding: 1.15rem 0.85rem;
          color: var(--ink);
          background:
            radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.42), transparent 32%),
            radial-gradient(circle at 50% 100%, rgba(80, 160, 210, 0.18), transparent 55%),
            linear-gradient(160deg, rgba(180, 220, 245, 0.16), rgba(20, 40, 60, 0.12) 58%, rgba(126, 182, 212, 0.1));
          border: 1px solid rgba(255, 255, 255, 0.28);
          box-shadow:
            inset 8px 10px 18px rgba(255, 255, 255, 0.18),
            inset -10px -14px 22px rgba(10, 30, 50, 0.28),
            0 14px 28px rgba(0, 0, 0, 0.22);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
          transform-style: preserve-3d;
          transition: transform 0.2s ease, box-shadow 0.35s ease, filter 0.35s ease;
        }
        .stats.stats-orbs .stat::after {
          content: "";
          position: absolute;
          inset: -12%;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(126, 182, 212, 0.42), transparent 68%);
          filter: blur(10px);
          z-index: 0;
          animation: orb-glow 3.6s ease-in-out infinite;
          pointer-events: none;
        }
        .stats.stats-orbs .stat:nth-child(2)::after { animation-delay: 0.5s; }
        .stats.stats-orbs .stat:nth-child(3)::after { animation-delay: 1.1s; }
        .stats.stats-orbs .stat:nth-child(4)::after { animation-delay: 1.8s; }
        .stats.stats-orbs .stat b {
          font-size: clamp(1.15rem, 2.4vw, 1.55rem);
          color: var(--stat);
          text-shadow: 0 0 12px rgba(126, 182, 212, 0.55);
          line-height: 1.15;
        }
        .stats.stats-orbs .stat span {
          margin-top: 0.35rem;
          max-width: 9rem;
          font-size: 0.72rem;
          line-height: 1.3;
          color: var(--muted);
        }
        .stats.stats-orbs .stat:hover .stat-core,
        .stats.stats-orbs .stat:focus-within .stat-core {
          filter: brightness(1.16);
          box-shadow:
            inset 8px 10px 18px rgba(255, 255, 255, 0.28),
            inset -10px -14px 22px rgba(10, 30, 50, 0.22),
            0 18px 36px rgba(0, 0, 0, 0.28),
            0 0 28px rgba(126, 182, 212, 0.7),
            0 0 54px rgba(126, 182, 212, 0.35);
        }
        .stats.stats-orbs .stat:hover::after,
        .stats.stats-orbs .stat:focus-within::after {
          opacity: 1;
          filter: blur(8px) brightness(1.35);
        }
        [data-theme="light"] .stats.stats-orbs .stat-core {
          background:
            radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.92), transparent 34%),
            radial-gradient(circle at 50% 100%, rgba(90, 170, 220, 0.16), transparent 58%),
            linear-gradient(160deg, rgba(255, 255, 255, 0.42), rgba(170, 210, 235, 0.22));
          border-color: rgba(255, 255, 255, 0.85);
          box-shadow:
            inset 8px 10px 16px rgba(255, 255, 255, 0.7),
            inset -8px -12px 18px rgba(80, 130, 170, 0.16),
            0 12px 26px rgba(40, 80, 120, 0.14);
        }
        [data-theme="light"] .stats.stats-orbs .stat::after {
          background: radial-gradient(circle, rgba(90, 170, 220, 0.38), transparent 68%);
        }
        @keyframes orb-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-0.7rem); }
        }
        @keyframes orb-glow {
          0%, 100% { opacity: 0.55; transform: scale(0.92); }
          50% { opacity: 1; transform: scale(1.08); }
        }
        @media (max-width: 980px) {
          .stats.stats-orbs { grid-template-columns: 1fr 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
          .stats.stats-orbs .stat,
          .stats.stats-orbs .stat::after {
            animation: none;
          }
        }
      </style>
