<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4S Institutions Open Edition</title>
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css" />
  </head>
  <body data-page="home">
    <div id="site-header"></div>
    <main class="wrap">
      <style>
        .ed-home { padding: 2.6rem 0 0; }
        .ed-home + .stats { margin-top: 2.4rem; }
        .ed-hero { padding: 0 0 3.1rem; border-bottom: 1px solid var(--line); }
        .ed-mark,
        .ed-num {
          margin: 0 0 1.15rem;
          font-size: 0.72rem;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--muted);
        }
        .ed-hero h1 {
          margin: 0 0 1.55rem;
          max-width: 22rem;
          font-size: clamp(2.05rem, 4.6vw, 3.2rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
        }
        .ed-meta {
          margin: 0;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .ed-sec { padding: 3rem 0; border-bottom: 1px solid var(--line); }
        .ed-sec h2 {
          margin: 0 0 0.85rem;
          max-width: 24rem;
          font-size: clamp(1.55rem, 3vw, 2.1rem);
          line-height: 1.18;
          letter-spacing: -0.025em;
        }
        .ed-sec p {
          margin: 0 0 0.55rem;
          max-width: 34rem;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.55;
        }
        .ed-sec .ed-caption {
          margin-top: 1.15rem;
          color: var(--ink);
          font-weight: 600;
        }
        .ed-link {
          display: inline-block;
          margin-top: 1.15rem;
          padding-bottom: 0.05rem;
          color: var(--ink);
          border-bottom: 1px solid currentColor;
          text-decoration: none;
        }
        .ed-link:hover { color: var(--accent); text-decoration: none; }
        .ed-live {
          margin: 1.7rem 0 0.35rem;
          width: 100%;
          aspect-ratio: 16 / 9;
          overflow: hidden;
        }
        #home-chart-live {
          container-type: inline-size;
          max-width: none;
          width: 100%;
          height: calc(min(52rem, 82cqi) * 520 / 1000);
          aspect-ratio: auto;
          margin-top: 1.15rem;
          padding-bottom: 1.35rem;
          overflow: visible;
          perspective: 900px;
        }
        #home-chart-live.swiper {
          margin-left: 0;
          margin-right: 0;
        }
        #home-chart-live .swiper-wrapper {
          align-items: stretch;
          transform-style: preserve-3d;
        }
        #home-chart-live .swiper-slide {
          width: min(52rem, 82%);
          height: 100%;
          background: #fff;
          box-shadow:
            0 22px 48px rgba(0, 0, 0, 0.32),
            0 6px 16px rgba(0, 0, 0, 0.18);
        }
        #home-chart-live .swiper-slide-active {
          box-shadow:
            0 28px 64px rgba(0, 0, 0, 0.4),
            0 10px 22px rgba(0, 0, 0, 0.22);
        }
        #home-chart-live .swiper-slide-shadow-left,
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to left,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-button-prev,
        #home-chart-live .swiper-button-next {
          color: var(--ink);
          width: 2rem;
          height: 2rem;
          margin-top: 0;
          top: 50%;
          transform: translateY(-50%);
        }
        #home-chart-live .swiper-button-prev::after,
        #home-chart-live .swiper-button-next::after {
          font-size: 1.15rem;
          font-weight: 700;
        }
        #home-chart-live .swiper-button-prev { left: -0.2rem; }
        #home-chart-live .swiper-button-next { right: -0.2rem; }
        .ed-live iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: 0;
          background: transparent;
          opacity: 1;
          transition: opacity 0.4s ease;
        }
        .ed-live iframe.is-wait { opacity: 0; }
        #home-map-live {
          width: min(52rem, 82%);
          max-width: min(52rem, 82%);
          aspect-ratio: 1000 / 520;
          margin-top: 1.15rem;
          margin-left: auto;
          margin-right: auto;
        }
        #home-chart-dots {
          position: static;
          bottom: auto;
          left: auto;
          width: auto;
          transform: none;
          display: flex;
          justify-content: center;
          gap: 0.45rem;
          margin: 0.85rem 0 0.35rem;
        }
        #home-chart-dots .swiper-pagination-bullet {
          width: 0.45rem;
          height: 0.45rem;
          margin: 0 !important;
          border-radius: 50%;
          background: var(--muted);
          opacity: 0.4;
        }
        #home-chart-dots .swiper-pagination-bullet-active {
          background: var(--ink);
          opacity: 1;
        }
        .stats.stats-orbs {
          display: flex;
          flex-wrap: wrap;
          align-items: flex-end;
          justify-content: center;
          gap: 0.4rem 2.4rem;
          min-height: 17.5rem;
          margin: 0.2rem 0 2.4rem;
          padding: 1.1rem 0 2.2rem;
          overflow: visible;
        }
        .stats.stats-orbs .stat {
          --tilt-x: 0deg;
          --tilt-y: 0deg;
          --orb: 168, 214, 236;
          --orb-deep: 40, 92, 128;
          position: relative;
          flex: 0 0 auto;
          aspect-ratio: 1;
          padding: 0;
          border: 0;
          background: transparent;
          perspective: 800px;
          animation: orb-float 5.4s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(1) {
          width: min(12.8rem, 42vw);
          margin-bottom: 2.1rem;
          animation-duration: 5.1s;
          --orb: 186, 228, 248;
          --orb-deep: 36, 102, 148;
        }
        .stats.stats-orbs .stat:nth-child(2) {
          width: min(9.6rem, 34vw);
          margin-bottom: 0.15rem;
          animation-delay: 0.85s;
          animation-duration: 6.2s;
          --orb: 156, 214, 210;
          --orb-deep: 28, 96, 108;
        }
        .stats.stats-orbs .stat:nth-child(3) {
          width: min(13.6rem, 44vw);
          margin-bottom: 2.8rem;
          animation-delay: 0.35s;
          animation-duration: 5.8s;
          --orb: 210, 236, 255;
          --orb-deep: 48, 88, 150;
        }
        .stats.stats-orbs .stat:nth-child(4) {
          width: min(10.4rem, 36vw);
          margin-bottom: 0.85rem;
          animation-delay: 1.4s;
          animation-duration: 4.7s;
          --orb: 148, 196, 232;
          --orb-deep: 24, 78, 132;
        }
        .stats.stats-orbs .stat-core {
          position: relative;
          z-index: 1;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          text-align: center;
          padding: 1.2rem 0.9rem;
          color: var(--ink);
          background:
            radial-gradient(circle at 28% 22%, rgba(255, 255, 255, 0.38) 0 7%, transparent 22%),
            radial-gradient(circle at 72% 78%, rgba(var(--orb-deep), 0.12), transparent 42%),
            radial-gradient(circle at 50% 45%, rgba(var(--orb), 0.1), rgba(var(--orb-deep), 0.08) 62%, rgba(8, 18, 32, 0.06) 100%);
          border: 1px solid rgba(255, 255, 255, 0.22);
          box-shadow:
            inset 8px 10px 16px rgba(255, 255, 255, 0.12),
            inset -10px -12px 18px rgba(var(--orb-deep), 0.16),
            0 0 0 1px rgba(255, 255, 255, 0.05),
            0 14px 28px rgba(8, 20, 36, 0.14),
            0 0 16px rgba(var(--orb), 0.14);
          backdrop-filter: blur(16px) saturate(1.25);
          -webkit-backdrop-filter: blur(16px) saturate(1.25);
          transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
          transform-style: preserve-3d;
          transition: transform 0.22s ease, box-shadow 0.35s ease, filter 0.35s ease;
        }
        .stats.stats-orbs .stat-core::before {
          content: "";
          position: absolute;
          top: 13%;
          left: 20%;
          width: 34%;
          height: 18%;
          border-radius: 50%;
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.55), rgba(255, 255, 255, 0.06));
          filter: blur(0.4px);
          transform: rotate(-28deg);
          pointer-events: none;
        }
        .stats.stats-orbs .stat-core::after {
          content: "";
          position: absolute;
          right: 18%;
          bottom: 16%;
          width: 18%;
          height: 10%;
          border-radius: 50%;
          background: rgba(255, 255, 255, 0.14);
          filter: blur(1.5px);
          pointer-events: none;
        }
        .stats.stats-orbs .stat::before {
          content: "";
          position: absolute;
          inset: 7%;
          border-radius: 50%;
          border: 1px solid rgba(255, 255, 255, 0.14);
          box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.08);
          pointer-events: none;
          z-index: 2;
        }
        .stats.stats-orbs .stat::after {
          content: "";
          position: absolute;
          inset: -18%;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(var(--orb), 0.28), transparent 66%);
          filter: blur(12px);
          z-index: 0;
          animation: orb-glow 3.8s ease-in-out infinite;
          pointer-events: none;
        }
        .stats.stats-orbs .stat:nth-child(2)::after { animation-delay: 0.6s; }
        .stats.stats-orbs .stat:nth-child(3)::after { animation-delay: 1.2s; }
        .stats.stats-orbs .stat:nth-child(4)::after { animation-delay: 1.9s; }
        .stats.stats-orbs .stat b {
          position: relative;
          z-index: 3;
          font-size: clamp(1.05rem, 2.2vw, 1.5rem);
          color: var(--stat);
          text-shadow: 0 0 10px rgba(var(--orb), 0.35);
          line-height: 1.12;
        }
        .stats.stats-orbs .stat span {
          position: relative;
          z-index: 3;
          margin-top: 0.32rem;
          max-width: 8.6rem;
          font-size: 0.7rem;
          line-height: 1.3;
          color: var(--muted);
        }
        .stats.stats-orbs .stat:nth-child(2) b,
        .stats.stats-orbs .stat:nth-child(4) b {
          font-size: clamp(0.95rem, 1.9vw, 1.28rem);
        }
        .stats.stats-orbs .stat:hover .stat-core,
        .stats.stats-orbs .stat:focus-within .stat-core {
          filter: none;
          box-shadow:
            inset 8px 10px 16px rgba(255, 255, 255, 0.16),
            inset -10px -12px 18px rgba(var(--orb-deep), 0.14),
            0 16px 32px rgba(8, 20, 36, 0.16),
            0 0 18px rgba(var(--orb), 0.22);
        }
        .stats.stats-orbs .stat:hover::after,
        .stats.stats-orbs .stat:focus-within::after {
          filter: blur(12px);
          opacity: 0.7;
        }
        [data-theme="light"] .stats.stats-orbs .stat-core {
          background:
            radial-gradient(circle at 28% 22%, rgba(255, 255, 255, 0.5) 0 8%, transparent 22%),
            radial-gradient(circle at 72% 78%, rgba(var(--orb-deep), 0.08), transparent 44%),
            radial-gradient(circle at 50% 45%, rgba(255, 255, 255, 0.16), rgba(var(--orb), 0.12) 70%);
          border-color: rgba(255, 255, 255, 0.45);
          box-shadow:
            inset 8px 10px 14px rgba(255, 255, 255, 0.28),
            inset -8px -12px 16px rgba(var(--orb-deep), 0.08),
            0 12px 24px rgba(40, 80, 120, 0.08),
            0 0 14px rgba(var(--orb), 0.16);
        }
        [data-theme="light"] .stats.stats-orbs .stat::after {
          background: radial-gradient(circle, rgba(var(--orb), 0.22), transparent 66%);
        }
        @keyframes orb-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-0.85rem); }
        }
        @keyframes orb-glow {
          0%, 100% { opacity: 0.32; transform: scale(0.92); }
          50% { opacity: 0.62; transform: scale(1.06); }
        }
        @media (max-width: 980px) {
          .stats.stats-orbs {
            gap: 1.2rem 1.6rem;
            min-height: 0;
          }
          .stats.stats-orbs .stat:nth-child(1),
          .stats.stats-orbs .stat:nth-child(3) { margin-bottom: 0.4rem; }
        }
        @media (prefers-reduced-motion: reduce) {
          .stats.stats-orbs .stat,
          .stats.stats-orbs .stat::after {
            animation: none;
          }
        }
      </style>

      <div class="ed-home">
        <header class="ed-hero">
          <p class="ed-mark" data-i18n="edMark"></p>

        <section class="ed-sec">
