<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4S Institutions Open Edition</title>
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css" />
  </head>
  <body data-page="home">
    <div id="site-header"></div>
    <main class="wrap">
      <style>
        .ed-home { padding: 2.6rem 0 0; }
        .ed-home + .stats { margin-top: 2.4rem; }
        .ed-hero { padding: 0 0 3.1rem; border-bottom: 1px solid var(--line); }
        .ed-mark,
        .ed-num {
          margin: 0 0 1.15rem;
          font-size: 0.72rem;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--muted);
        }
        .ed-hero h1 {
          margin: 0 0 1.55rem;
          max-width: 22rem;
          font-size: clamp(2.05rem, 4.6vw, 3.2rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
        }
        .ed-meta {
          margin: 0;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .ed-sec { padding: 3rem 0; border-bottom: 1px solid var(--line); }
        .ed-sec h2 {
          margin: 0 0 0.85rem;
          max-width: 24rem;
          font-size: clamp(1.55rem, 3vw, 2.1rem);
          line-height: 1.18;
          letter-spacing: -0.025em;
        }
        .ed-sec p {
          margin: 0 0 0.55rem;
          max-width: 34rem;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.55;
        }
        .ed-sec .ed-caption {
          margin-top: 1.15rem;
          color: var(--ink);
          font-weight: 600;
        }
        .ed-link {
          display: inline-block;
          margin-top: 1.15rem;
          padding-bottom: 0.05rem;
          color: var(--ink);
          border-bottom: 1px solid currentColor;
          text-decoration: none;
        }
        .ed-link:hover { color: var(--accent); text-decoration: none; }
        .ed-live {
          margin: 1.7rem 0 0.35rem;
          width: 100%;
          aspect-ratio: 16 / 9;
          overflow: hidden;
        }
        #home-chart-live {
          container-type: inline-size;
          max-width: none;
          width: 100%;
          height: calc(min(52rem, 82cqi) * 520 / 1000);
          aspect-ratio: auto;
          margin-top: 1.15rem;
          padding-bottom: 1.35rem;
          overflow: visible;
          perspective: 900px;
        }
        #home-chart-live.swiper {
          margin-left: 0;
          margin-right: 0;
        }
        #home-chart-live .swiper-wrapper {
          align-items: stretch;
          transform-style: preserve-3d;
        }
        #home-chart-live .swiper-slide {
          width: min(52rem, 82%);
          height: 100%;
          background: #fff;
          box-shadow:
            0 22px 48px rgba(0, 0, 0, 0.32),
            0 6px 16px rgba(0, 0, 0, 0.18);
        }
        #home-chart-live .swiper-slide-active {
          box-shadow:
            0 28px 64px rgba(0, 0, 0, 0.4),
            0 10px 22px rgba(0, 0, 0, 0.22);
        }
        #home-chart-live .swiper-slide-shadow-left,
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to left,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-button-prev,
        #home-chart-live .swiper-button-next {
          color: var(--ink);
          width: 2rem;
          height: 2rem;
          margin-top: 0;
          top: 50%;
          transform: translateY(-50%);
        }
        #home-chart-live .swiper-button-prev::after,
        #home-chart-live .swiper-button-next::after {
          font-size: 1.15rem;
          font-weight: 700;
        }
        #home-chart-live .swiper-button-prev { left: -0.2rem; }
        #home-chart-live .swiper-button-next { right: -0.2rem; }
        .ed-live iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: 0;
          background: transparent;
          opacity: 1;
          transition: opacity 0.4s ease;
        }
        .ed-live iframe.is-wait { opacity: 0; }
        #home-map-live {
          width: min(52rem, 82%);
          max-width: min(52rem, 82%);
          aspect-ratio: 1000 / 520;
          margin-top: 1.15rem;
          margin-left: auto;
          margin-right: auto;
        }
        #home-chart-dots {
          position: static;
          bottom: auto;
          left: auto;
          width: auto;
          transform: none;
          display: flex;
          justify-content: center;
          gap: 0.45rem;
          margin: 0.85rem 0 0.35rem;
        }
        #home-chart-dots .swiper-pagination-bullet {
          width: 0.45rem;
          height: 0.45rem;
          margin: 0 !important;
          border-radius: 50%;
          background: var(--muted);
          opacity: 0.4;
        }
        #home-chart-dots .swiper-pagination-bullet-active {
          background: var(--ink);
          opacity: 1;
        }
        .stats.stats-orbs {
          display: flex;
          flex-wrap: wrap;
          align-items: flex-end;
          justify-content: center;
          gap: 0.4rem 2.4rem;
          min-height: 17.5rem;
          margin: 0.2rem 0 2.4rem;
          padding: 1.1rem 0 2.2rem;
          overflow: visible;
        }
        .stats.stats-orbs .stat {
          --blob-a: 126, 212, 186;
          --blob-b: 90, 168, 204;
          --blob-c: 122, 140, 224;
          position: relative;
          flex: 0 0 auto;
          aspect-ratio: 1;
          padding: 0;
          border: 0;
          background: transparent;
          animation: orb-float 5.4s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(1) {
          width: min(12.8rem, 42vw);
          margin-bottom: 2.1rem;
          animation-duration: 5.1s;
        }
        .stats.stats-orbs .stat:nth-child(2) {
          width: min(9.6rem, 34vw);
          margin-bottom: 0.15rem;
          animation-delay: 0.85s;
          animation-duration: 6.2s;
          --blob-a: 104, 204, 196;
          --blob-b: 72, 164, 188;
          --blob-c: 96, 148, 216;
        }
        .stats.stats-orbs .stat:nth-child(3) {
          width: min(13.6rem, 44vw);
          margin-bottom: 2.8rem;
          animation-delay: 0.35s;
          animation-duration: 5.8s;
          --blob-a: 148, 216, 198;
          --blob-b: 110, 168, 214;
          --blob-c: 132, 148, 232;
        }
        .stats.stats-orbs .stat:nth-child(4) {
          width: min(10.4rem, 36vw);
          margin-bottom: 0.85rem;
          animation-delay: 1.4s;
          animation-duration: 4.7s;
          --blob-a: 112, 196, 210;
          --blob-b: 88, 152, 208;
          --blob-c: 118, 132, 220;
        }
        .stats.stats-orbs .stat-blob {
          position: absolute;
          inset: 0;
          z-index: 1;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          background: linear-gradient(
            145deg,
            rgba(var(--blob-a), 0.42),
            rgba(var(--blob-b), 0.38) 48%,
            rgba(var(--blob-c), 0.44)
          );
          box-shadow: 0 0 42px rgba(var(--blob-c), 0.22);
          backdrop-filter: blur(14px) saturate(1.15);
          -webkit-backdrop-filter: blur(14px) saturate(1.15);
          animation: blob-morph 8s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(2) .stat-blob {
          animation-duration: 9.4s;
          animation-delay: -2.1s;
        }
        .stats.stats-orbs .stat:nth-child(3) .stat-blob {
          animation-duration: 7.6s;
          animation-delay: -4.4s;
        }
        .stats.stats-orbs .stat:nth-child(4) .stat-blob {
          animation-duration: 10.2s;
          animation-delay: -1.3s;
        }
        .stats.stats-orbs .stat-inner {
          position: relative;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          text-align: center;
          padding: 1.2rem 0.9rem;
          pointer-events: none;
        }
        .stats.stats-orbs .stat::after {
          content: "";
          position: absolute;
          inset: -28%;
          z-index: 0;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          background: radial-gradient(circle, rgba(var(--blob-b), 0.28), transparent 68%);
          filter: blur(28px);
          animation: blob-morph 8s ease-in-out infinite;
          pointer-events: none;
        }
        .stats.stats-orbs .stat:nth-child(2)::after {
          animation-duration: 9.4s;
          animation-delay: -2.1s;
        }
        .stats.stats-orbs .stat:nth-child(3)::after {
          animation-duration: 7.6s;
          animation-delay: -4.4s;
        }
        .stats.stats-orbs .stat:nth-child(4)::after {
          animation-duration: 10.2s;
          animation-delay: -1.3s;
        }
        .stats.stats-orbs .stat-inner b {
          font-size: clamp(1.05rem, 2.2vw, 1.5rem);
          color: #fff;
          letter-spacing: 0.04em;
          text-shadow: 0 1px 8px rgba(20, 36, 72, 0.22);
          line-height: 1.12;
        }
        .stats.stats-orbs .stat-inner span {
          margin-top: 0.32rem;
          max-width: 8.6rem;
          font-size: 0.7rem;
          line-height: 1.3;
          color: rgba(255, 255, 255, 0.82);
        }
        .stats.stats-orbs .stat:nth-child(2) .stat-inner b,
        .stats.stats-orbs .stat:nth-child(4) .stat-inner b {
          font-size: clamp(0.95rem, 1.9vw, 1.28rem);
        }
        .stats.stats-orbs .stat:hover .stat-blob,
        .stats.stats-orbs .stat:focus-within .stat-blob {
          box-shadow: 0 0 48px rgba(var(--blob-c), 0.28);
        }
        [data-theme="light"] .stats.stats-orbs .stat-blob {
          background: linear-gradient(
            145deg,
            rgba(var(--blob-a), 0.5),
            rgba(var(--blob-b), 0.46) 48%,
            rgba(var(--blob-c), 0.52)
          );
        }
        [data-theme="light"] .stats.stats-orbs .stat::after {
          background: radial-gradient(circle, rgba(var(--blob-b), 0.2), transparent 68%);
        }
        @keyframes orb-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-0.85rem); }
        }
        @keyframes blob-morph {
          0% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            rotate: 0deg;
          }
          25% {
            border-radius: 30% 60% 70% 40% / 50% 60% 30% 70%;
            rotate: 8deg;
          }
          50% {
            border-radius: 50% 60% 30% 70% / 30% 40% 70% 60%;
            rotate: -6deg;
          }
          75% {
            border-radius: 40% 70% 60% 30% / 70% 30% 50% 60%;
            rotate: 5deg;
          }
          100% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            rotate: 0deg;
          }
        }
        @media (max-width: 980px) {
          .stats.stats-orbs {
            gap: 1.2rem 1.6rem;
            min-height: 0;
          }
          .stats.stats-orbs .stat:nth-child(1),
          .stats.stats-orbs .stat:nth-child(3) { margin-bottom: 0.4rem; }
        }
        @media (prefers-reduced-motion: reduce) {
          .stats.stats-orbs .stat,
          .stats.stats-orbs .stat::after,
          .stats.stats-orbs .stat-blob {
            animation: none;
          }
        }
      </style>
