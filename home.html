<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("ai4s-theme") === "light" ? "light" : "dark";
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI4S Institutions Open Edition</title>
    <link rel="stylesheet" href="vendor/swiper/swiper-bundle.min.css" />
  </head>
  <body data-page="home">
    <div id="site-header"></div>
    <main class="wrap">
      <style>
        .ed-home { padding: 2.6rem 0 0; }
        .ed-home + .stats { margin-top: 2.4rem; }
        .ed-hero { padding: 0 0 3.1rem; border-bottom: 1px solid var(--line); }
        .ed-mark,
        .ed-num {
          margin: 0 0 1.15rem;
          font-size: 0.72rem;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--muted);
        }
        .ed-hero h1 {
          margin: 0 0 1.55rem;
          max-width: 22rem;
          font-size: clamp(2.05rem, 4.6vw, 3.2rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
        }
        .ed-meta {
          margin: 0;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .ed-sec { padding: 3rem 0; border-bottom: 1px solid var(--line); }
        .ed-sec h2 {
          margin: 0 0 0.85rem;
          max-width: 24rem;
          font-size: clamp(1.55rem, 3vw, 2.1rem);
          line-height: 1.18;
          letter-spacing: -0.025em;
        }
        .ed-sec p {
          margin: 0 0 0.55rem;
          max-width: 34rem;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.55;
        }
        .ed-sec .ed-caption {
          margin-top: 1.15rem;
          color: var(--ink);
          font-weight: 600;
        }
        .ed-link {
          display: inline-block;
          margin-top: 1.15rem;
          padding-bottom: 0.05rem;
          color: var(--ink);
          border-bottom: 1px solid currentColor;
          text-decoration: none;
        }
        .ed-link:hover { color: var(--accent); text-decoration: none; }
        .ed-live {
          margin: 1.7rem 0 0.35rem;
          width: 100%;
          aspect-ratio: 16 / 9;
          overflow: hidden;
        }
        #home-chart-live {
          --slide-w: min(22rem, 78vw);
          --slide-h: calc(var(--slide-w) * 520 / 1000);
          max-width: none;
          width: 100%;
          height: var(--slide-h);
          aspect-ratio: auto;
          margin-top: 1.15rem;
          overflow: hidden;
          -webkit-mask-image: linear-gradient(to right, #000 0%, #000 82%, transparent 100%);
          mask-image: linear-gradient(to right, #000 0%, #000 82%, transparent 100%);
        }
        #home-chart-live.swiper {
          margin-left: 0;
          margin-right: 0;
        }
        #home-chart-live .swiper-wrapper {
          align-items: center;
        }
        #home-chart-live .swiper-slide {
          width: var(--slide-w);
          height: var(--slide-h);
          opacity: 0.42;
          filter: saturate(0.7);
          transform: scale(0.92);
          transform-origin: center center;
          transition: opacity 0.45s ease, transform 0.45s ease, filter 0.45s ease;
        }
        #home-chart-live .swiper-slide-active {
          opacity: 1;
          filter: none;
          transform: scale(1);
          z-index: 2;
        }
        .ed-live iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: 0;
          background: transparent;
          opacity: 1;
          transition: opacity 0.4s ease;
        }
        .ed-live iframe.is-wait { opacity: 0; }
        #home-chart-dots {
          position: static;
          bottom: auto;
          left: auto;
          width: auto;
          transform: none;
          display: flex;
          gap: 0.4rem;
          margin: 0 0 0.35rem;
        }
        #home-chart-dots .swiper-pagination-bullet {
          width: 1.55rem;
          height: 2px;
          margin: 0 !important;
          border-radius: 0;
          background: var(--line);
          opacity: 1;
        }
        #home-chart-dots .swiper-pagination-bullet-active {
          background: var(--ink);
        }
      </style>

      <div class="ed-home">
        <header class="ed-hero">
          <p class="ed-mark" data-i18n="edMark"></p>
          <h1 data-i18n-html="edHeroTitle"></h1>
          <p class="ed-meta" data-i18n-html="edHeroMeta"></p>
        </header>

        <section class="ed-sec">
          <p class="ed-num" data-i18n="ed01Num"></p>
          <h2 data-i18n="ed01Title"></h2>
          <p data-i18n="ed01Body"></p>
          <a class="ed-link" href="explore/list.html" data-i18n="ed01Link"></a>
        </section>

        <section class="ed-sec">
          <p class="ed-num" data-i18n="ed02Num"></p>
          <h2 data-i18n="ed02Title"></h2>
          <div class="ed-live swiper" id="home-chart-live">
            <div class="swiper-wrapper" id="home-chart-slides"></div>
          </div>
          <div class="swiper-pagination" id="home-chart-dots"></div>
          <p class="ed-caption" data-i18n="ed02Caption"></p>
          <p data-i18n="ed02Body"></p>
          <a class="ed-link" href="explore/chart.html" data-i18n="ed02Link"></a>
        </section>

        <section class="ed-sec">
          <p class="ed-num" data-i18n="ed03Num"></p>
          <h2 data-i18n="ed03Title"></h2>
          <div class="ed-live">
            <iframe id="home-map-frame" title="AI4S map" loading="lazy"></iframe>
          </div>
          <a class="ed-link" href="explore/map.html" data-i18n="ed03Link"></a>
        </section>

        <section class="ed-sec">
          <p class="ed-num" data-i18n="ed04Num"></p>
          <h2 data-i18n-html="ed04Title"></h2>
          <a class="ed-link" href="explore/compare.html" data-i18n="ed04Link"></a>
        </section>
      </div>

      <div class="stats">
        <div class="stat"><b id="stat-n">—</b><span data-i18n="statN"></span></div>
        <div class="stat"><b id="stat-c">—</b><span data-i18n="statC"></span></div>
        <div class="stat"><b>2024</b><span data-i18n="statY"></span></div>
        <div class="stat"><b data-i18n="statSValue">Education</b><span data-i18n="statS"></span></div>
      </div>

      <div class="principles">
        <section class="principle">
          <span class="principle-n">01</span>
          <h3 data-i18n="prin1Title"></h3>
          <p data-i18n="prin1Body"></p>
        </section>
        <section class="principle">
          <span class="principle-n">02</span>
          <h3 data-i18n="prin2Title"></h3>
          <p data-i18n="prin2Body"></p>
        </section>
        <section class="principle">
          <span class="principle-n">03</span>
          <h3 data-i18n="prin3Title"></h3>
          <p data-i18n="prin3Body"></p>
        </section>
      </div>

      <aside class="news-box">
        <h2 data-i18n="warnTitle"></h2>
        <ul class="warn-list">
          <li data-i18n="w1"></li>
          <li data-i18n="w2"></li>
          <li data-i18n="w3"></li>
        </ul>
        <a href="info/responsible-use.html" data-i18n="navUse"></a>
      </aside>
    </main>
    <div id="site-footer"></div>
    <script src="vendor/swiper/swiper-bundle.min.js"></script>
    <script type="module" src="src/pages/home.js?v=ed9"></script>
  </body>
</html>
