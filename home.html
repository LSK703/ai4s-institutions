<!doctype html>

  <body data-page="home">
    <div id="site-header"></div>
    <main class="wrap">
      <style>
        body[data-page="home"] { overflow-x: clip; }
        .ed-home { padding: 0; }
        .ed-stage {
          position: relative;
          padding: 2.6rem 0 0;
        }
        .ed-stage::before,
        .ed-stage::after {
          content: "";
          position: absolute;
          top: -22%;
          bottom: -28%;
          left: calc(50% - 50vw);
          width: 100vw;
          z-index: 0;
          pointer-events: none;
        }
        .ed-stage::before {
          background: repeating-radial-gradient(
            circle at 64% 42%,
            color-mix(in srgb, #cfe6f2 8%, transparent) 0,
            color-mix(in srgb, #8ec4de 36%, transparent) 1.35%,
            color-mix(in srgb, #e7f3f8 4%, transparent) 2.7%,
            color-mix(in srgb, #7eb6d4 22%, transparent) 4.05%
          );
          filter: blur(28px) saturate(1.08);
          opacity: 0.88;
          -webkit-mask-image: radial-gradient(
            ellipse 92% 78% at 64% 42%,
            #000 18%,
            #000 48%,
            transparent 76%
          );
          mask-image: radial-gradient(
            ellipse 92% 78% at 64% 42%,
            #000 18%,
            #000 48%,
            transparent 76%
          );
        }
        .ed-stage::after {
          background: radial-gradient(
            circle at 64% 42%,
            color-mix(in srgb, #b7d8ea 42%, transparent),
            color-mix(in srgb, #9cc9e0 12%, transparent) 38%,
            transparent 68%
          );
          filter: blur(56px);
        }
        .ed-stage > * { position: relative; z-index: 1; }
        .ed-hero { padding: 0 0 0.6rem; }
        .ed-mark,
        .ed-num {
          margin: 0 0 1.15rem;
          font-size: 0.72rem;
          letter-spacing: 0.16em;
          text-transform: uppercase;
          font-weight: 600;
          color: var(--muted);
        }
        .ed-hero h1 {
          margin: 0 0 1.55rem;
          max-width: 22rem;
          font-size: clamp(2.05rem, 4.6vw, 3.2rem);
          line-height: 1.12;
          letter-spacing: -0.03em;
        }
        .ed-meta {
          margin: 0;
          color: var(--muted);
          font-size: 0.95rem;
          line-height: 1.6;
        }
        .ed-sec { padding: 3rem 0; border-bottom: 1px solid var(--line); }
        .ed-sec h2 {
          margin: 0 0 0.85rem;
          max-width: 24rem;
          font-size: clamp(1.55rem, 3vw, 2.1rem);
          line-height: 1.18;
          letter-spacing: -0.025em;
        }
        .ed-sec p {
          margin: 0 0 0.55rem;
          max-width: 34rem;
          color: var(--muted);
          font-size: 1.02rem;
          line-height: 1.55;
        }
        .ed-sec .ed-caption {
          margin-top: 1.15rem;
          color: var(--ink);
          font-weight: 600;
        }
        .ed-link {
          display: inline-block;
          margin-top: 1.15rem;
          padding-bottom: 0.05rem;
          color: var(--ink);
          border-bottom: 1px solid currentColor;
          text-decoration: none;
        }
        .ed-link:hover { color: var(--accent); text-decoration: none; }
        .ed-live {
          margin: 1.7rem 0 0.35rem;
          width: 100%;
          aspect-ratio: 16 / 9;
          overflow: hidden;
        }
        #home-chart-live {
          container-type: inline-size;
          max-width: none;
          width: 100%;
          height: calc(min(52rem, 82cqi) * 520 / 1000);
          aspect-ratio: auto;
          margin-top: 1.15rem;
          padding-bottom: 1.35rem;
          overflow: visible;
          perspective: 900px;
        }
        #home-chart-live.swiper {
          margin-left: 0;
          margin-right: 0;
        }
        #home-chart-live .swiper-wrapper {
          align-items: stretch;
          transform-style: preserve-3d;
        }
        #home-chart-live .swiper-slide {
          width: min(52rem, 82%);
          height: 100%;
          background: #fff;
          box-shadow:
            0 22px 48px rgba(0, 0, 0, 0.32),
            0 6px 16px rgba(0, 0, 0, 0.18);
        }
        #home-chart-live .swiper-slide-active {
          box-shadow:
            0 28px 64px rgba(0, 0, 0, 0.4),
            0 10px 22px rgba(0, 0, 0, 0.22);
        }
        #home-chart-live .swiper-slide-shadow-left,
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to left,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-slide-shadow-right {
          background-image: linear-gradient(
            to right,
            rgba(0, 0, 0, 0.42),
            rgba(0, 0, 0, 0.08),
            transparent
          );
        }
        #home-chart-live .swiper-button-prev,
        #home-chart-live .swiper-button-next {
          color: var(--ink);
          width: 2rem;
          height: 2rem;
          margin-top: 0;
          top: 50%;
          transform: translateY(-50%);
        }
        #home-chart-live .swiper-button-prev::after,
        #home-chart-live .swiper-button-next::after {
          font-size: 1.15rem;
          font-weight: 700;
        }
        #home-chart-live .swiper-button-prev { left: -0.2rem; }
        #home-chart-live .swiper-button-next { right: -0.2rem; }
        .ed-live iframe {
          display: block;
          width: 100%;
          height: 100%;
          border: 0;
          background: transparent;
          opacity: 1;
          transition: opacity 0.4s ease;
        }
        .ed-live iframe.is-wait { opacity: 0; }
        #home-map-live {
          width: min(52rem, 82%);
          max-width: min(52rem, 82%);
          aspect-ratio: 1000 / 520;
          margin-top: 1.15rem;
          margin-left: auto;
          margin-right: auto;
        }
        #home-chart-dots {
          position: static;
          bottom: auto;
          left: auto;
          width: auto;
          transform: none;
          display: flex;
          justify-content: center;
          gap: 0.45rem;
          margin: 0.85rem 0 0.35rem;
        }
        #home-chart-dots .swiper-pagination-bullet {
          width: 0.45rem;
          height: 0.45rem;
          margin: 0 !important;
          border-radius: 50%;
          background: var(--muted);
          opacity: 0.4;
        }
        #home-chart-dots .swiper-pagination-bullet-active {
          background: var(--ink);
          opacity: 1;
        }
        .stats.stats-orbs {
          display: flex;
          flex-wrap: wrap;
          align-items: flex-end;
          justify-content: center;
          gap: 0.4rem 2.4rem;
          min-height: 17.5rem;
          margin: 0.8rem 0 0;
          padding: 1.4rem 0 2.4rem;
          overflow: visible;
          border-bottom: 1px solid var(--line);
        }
        .stats.stats-orbs .stat {
          --tilt-x: 0deg;
          --tilt-y: 0deg;
          --rest-x: 14deg;
          --rest-y: -8deg;
          --blob-from: #d9f1fb;
          --blob-mid: #a8d4ea;
          --blob-to: #7eb6d4;
          position: relative;
          flex: 0 0 auto;
          aspect-ratio: 1;
          padding: 0;
          border: 0;
          background: transparent;
          perspective: 520px;
          perspective-origin: 50% 40%;
          animation: orb-float 5.4s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(1) {
          width: min(12.8rem, 42vw);
          margin-bottom: 2.1rem;
          animation-duration: 5.1s;
          --rest-x: 12deg;
          --rest-y: -10deg;
        }
        .stats.stats-orbs .stat:nth-child(2) {
          width: min(9.6rem, 34vw);
          margin-bottom: 0.15rem;
          animation-delay: 0.85s;
          animation-duration: 6.2s;
          --rest-x: 18deg;
          --rest-y: 8deg;
          --blob-from: #dff4fb;
          --blob-mid: #9cc9e0;
          --blob-to: #74b0d0;
        }
        .stats.stats-orbs .stat:nth-child(3) {
          width: min(13.6rem, 44vw);
          margin-bottom: 2.8rem;
          animation-delay: 0.35s;
          animation-duration: 5.8s;
          --rest-x: 11deg;
          --rest-y: -4deg;
          --blob-from: #e7f6fc;
          --blob-mid: #b5dceb;
          --blob-to: #7eb6d4;
        }
        .stats.stats-orbs .stat:nth-child(4) {
          width: min(10.4rem, 36vw);
          margin-bottom: 0.85rem;
          animation-delay: 1.4s;
          animation-duration: 4.7s;
          --rest-x: 16deg;
          --rest-y: 10deg;
          --blob-from: #d2ebf6;
          --blob-mid: #8ec4de;
          --blob-to: #6aa5c6;
        }
        .stats.stats-orbs .stat-core {
          position: relative;
          z-index: 1;
          width: 100%;
          height: 100%;
          transform-style: preserve-3d;
          transform: rotateX(calc(var(--rest-x) + var(--tilt-x))) rotateY(calc(var(--rest-y) + var(--tilt-y)));
          transition: transform 0.28s ease;
        }
        .stats.stats-orbs .stat-blob {
          position: absolute;
          inset: 0;
          z-index: 1;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          background: linear-gradient(
            145deg,
            color-mix(in srgb, var(--blob-from) 42%, transparent),
            color-mix(in srgb, var(--blob-mid) 34%, transparent) 48%,
            color-mix(in srgb, var(--blob-to) 40%, transparent)
          );
          box-shadow:
            inset 0 0 0 1px color-mix(in srgb, var(--blob-from) 50%, transparent),
            0 10px 22px rgba(20, 48, 72, 0.1),
            0 0 28px rgba(126, 182, 212, 0.16);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          transform: translateZ(0);
          animation: blob-morph 8s ease-in-out infinite;
        }
        .stats.stats-orbs .stat:nth-child(2) .stat-blob {
          animation-duration: 9.4s;
          animation-delay: -2.1s;
        }
        .stats.stats-orbs .stat:nth-child(3) .stat-blob {
          animation-duration: 7.6s;
          animation-delay: -4.4s;
        }
        .stats.stats-orbs .stat:nth-child(4) .stat-blob {
          animation-duration: 10.2s;
          animation-delay: -1.3s;
        }
        .stats.stats-orbs .stat-inner {
          position: absolute;
          inset: 0;
          z-index: 3;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          text-align: center;
          padding: 1.2rem 0.9rem;
          pointer-events: none;
          transform: translateZ(28px);
        }
        .stats.stats-orbs .stat::before {
          content: "";
          position: absolute;
          left: 18%;
          right: 18%;
          bottom: -16%;
          height: 20%;
          border-radius: 50%;
          background: radial-gradient(ellipse, rgba(8, 16, 28, 0.18), transparent 72%);
          filter: blur(8px);
          z-index: 0;
          pointer-events: none;
        }
        .stats.stats-orbs .stat::after {
          content: "";
          position: absolute;
          inset: -24%;
          z-index: 0;
          border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
          background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 68%);
          filter: blur(26px);
          animation: blob-morph 8s ease-in-out infinite;
          pointer-events: none;
        }
        .stats.stats-orbs .stat:nth-child(2)::after {
          animation-duration: 9.4s;
          animation-delay: -2.1s;
        }
        .stats.stats-orbs .stat:nth-child(3)::after {
          animation-duration: 7.6s;
          animation-delay: -4.4s;
        }
        .stats.stats-orbs .stat:nth-child(4)::after {
          animation-duration: 10.2s;
          animation-delay: -1.3s;
        }
        .stats.stats-orbs .stat-inner b {
          font-size: clamp(1.05rem, 2.2vw, 1.5rem);
          color: var(--stat);
          letter-spacing: 0.02em;
          text-shadow: none;
          line-height: 1.12;
        }
        .stats.stats-orbs .stat-inner span {
          margin-top: 0.32rem;
          max-width: 8.6rem;
          font-size: 0.7rem;
          line-height: 1.3;
          color: var(--ink);
        }
        .stats.stats-orbs .stat:nth-child(2) .stat-inner b,
        .stats.stats-orbs .stat:nth-child(4) .stat-inner b {
          font-size: clamp(0.95rem, 1.9vw, 1.28rem);
        }
        .stats.stats-orbs .stat:hover .stat-blob,
        .stats.stats-orbs .stat:focus-within .stat-blob {
          box-shadow:
            inset 0 0 0 1px color-mix(in srgb, var(--blob-from) 60%, transparent),
            0 12px 24px rgba(20, 48, 72, 0.12),
            0 0 30px rgba(126, 182, 212, 0.22);
        }
        [data-theme="light"] .stats.stats-orbs .stat {
          --blob-from: #c5e6f5;
          --blob-mid: #8ec4de;
          --blob-to: #5b9ec4;
        }
        [data-theme="light"] .stats.stats-orbs .stat::before {
          background: radial-gradient(ellipse, rgba(31, 90, 134, 0.16), transparent 72%);
        }
        [data-theme="light"] .stats.stats-orbs .stat::after {
          background: radial-gradient(circle, color-mix(in srgb, var(--accent) 16%, transparent), transparent 68%);
        }
        @keyframes orb-float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-0.85rem); }
        }
        @keyframes blob-morph {
          0% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            rotate: 0deg;
          }
          25% {
            border-radius: 30% 60% 70% 40% / 50% 60% 30% 70%;
            rotate: 8deg;
          }
          50% {
            border-radius: 50% 60% 30% 70% / 30% 40% 70% 60%;
            rotate: -6deg;
          }
          75% {
            border-radius: 40% 70% 60% 30% / 70% 30% 50% 60%;
            rotate: 5deg;
          }
          100% {
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            rotate: 0deg;
          }
        }
        @media (max-width: 980px) {
          .stats.stats-orbs {
            gap: 1.2rem 1.6rem;
            min-height: 0;
          }
          .stats.stats-orbs .stat:nth-child(1),
          .stats.stats-orbs .stat:nth-child(3) { margin-bottom: 0.4rem; }
        }
        @media (prefers-reduced-motion: reduce) {
          .stats.stats-orbs .stat,
          .stats.stats-orbs .stat::after,
          .stats.stats-orbs .stat-blob {
            animation: none;
          }
        }
        .principles.principles-cube {
          display: block;
          margin: 0.8rem auto 0.4rem;
          padding: 0.4rem 0 1.2rem;
          max-width: 22.5rem;
        }
        #prin-cube {
          width: 100%;
          height: 11.25rem;
          overflow: visible;
        }
        #prin-cube .swiper-slide {
          background: linear-gradient(145deg, #d9f1fb 0%, #a8d4ea 48%, #7eb6d4 100%);
          border: 0;
        }
        #prin-cube .principle {
          height: 100%;
          box-sizing: border-box;
          border: 0;
          background: transparent;
          padding: 1rem 1.15rem;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
        }
        #prin-cube .principle-n {
          color: #1f5a86;
          margin-bottom: 0.35rem;
        }
        #prin-cube h3 {
          margin: 0 0 0.35rem;
          color: #1a2330;
          font-size: 1.05rem;
          line-height: 1.3;
        }
        #prin-cube p {
          margin: 0;
          max-width: 18rem;
          color: #3d5163;
          font-size: 0.82rem;
          line-height: 1.45;
        }
        .prin-3d-pag {
          display: flex;
          justify-content: center;
          gap: 0.75rem;
          margin-top: 1.55rem;
          perspective: 520px;
        }
        .prin-3d-pag button {
          width: 2.2rem;
          height: 2.2rem;
          padding: 0;
          border: 0;
          background: transparent;
          cursor: pointer;
        }
        .prin-3d-box {
          display: block;
          width: 100%;
          height: 100%;
          position: relative;
          transform-style: preserve-3d;
          transition: transform 0.55s ease;
        }
        .prin-3d-pag button.is-on .prin-3d-box {
          transform: rotateX(-90deg);
        }
        .prin-3d-face {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(145deg, #d9f1fb, #9cc9e0);
          border: 1px solid rgba(126, 182, 212, 0.45);
          color: #1f5a86;
          font-size: 0.68rem;
          font-weight: 700;
          letter-spacing: 0.08em;
          backface-visibility: hidden;
        }
        .prin-3d-face.front { transform: translateZ(1.1rem); }
        .prin-3d-face.bottom {
          transform: rotateX(90deg) translateZ(1.1rem);
          background: linear-gradient(145deg, #9cc9e0, #7eb6d4);
          color: #0d141c;
          border-color: #7eb6d4;
        }
        @media (max-width: 700px) {
          .principles.principles-cube { max-width: 18.5rem; }
          #prin-cube { height: 12rem; }
        }
      </style>
